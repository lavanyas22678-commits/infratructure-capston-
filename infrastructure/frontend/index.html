<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Public Infrastructure Reporting System</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-header">

                <h1>
                    Public Infrastructure
                </h1>

                <p>
                    Reporting System
                </p>

            </div>


            <div class="login-content">

                <h2>
                    Login
                </h2>

                <p class="login-subtitle">
                    Login to report and track public issues.
                </p>


                <!-- Login Form -->

                <form id="loginForm">

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email ID
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>

                </form>


                <!-- Register -->

                <div class="register-link">

                    <p>
                        Don't have an account?
                    </p>

                    <a href="register.html">
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
