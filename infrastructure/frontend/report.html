<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Issue - Public Infrastructure</title>

    <link rel="stylesheet" href="report.css">

    <style>
        /* Location button */

        .location-btn {
            margin-top: 10px;
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            background-color: #1f4e79;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .location-btn:hover {
            background-color: #163a5c;
        }

        /* Detected location */

        #locationResult {
            margin-top: 10px;
            padding: 10px;
            background-color: #f4f7fb;
            border-radius: 6px;
            color: #1f4e79;
            font-size: 14px;
            display: none;
        }

        /* Image preview */

        #imagePreview {
            margin-top: 12px;
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
            object-fit: contain;
        }

        /* Keep navigation text white */

        .navbar nav a,
        .navbar nav a:visited,
        .navbar nav a:hover,
        .navbar nav a:active {
            color: white !important;
        }
    </style>
</head>

<body>

    <!-- ==========================================
         NAVIGATION BAR
         ========================================== -->

    <header class="navbar">

        <div class="logo">
            Public Infrastructure
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="report.html" class="active">Report Issue</a>
            <a href="my-reports.html">My Reports</a>
            <a href="report-details.html">Track Status</a>
        </nav>

    </header>


    <!-- ==========================================
         REPORT PAGE
         ========================================== -->

    <main class="report-page">

        <div class="report-container">

            <!-- HEADING -->

            <div class="report-heading">

                <h1>Report an Issue</h1>

                <p>
                    Help improve your community by reporting
                    public infrastructure issues.
                </p>

            </div>


            <!-- REPORT FORM -->

            <form id="reportForm" class="report-form">

                <!-- ISSUE TITLE -->

                <div class="form-group">

                    <label for="issueTitle">
                        Issue Title
                    </label>

                    <input
                        type="text"
                        id="issueTitle"
                        placeholder="Enter issue title"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Road">
                            Road
                        </option>

                        <option value="Street Light">
                            Street Light
                        </option>

                        <option value="Garbage">
                            Garbage
                        </option>

                        <option value="Water">
                            Water
                        </option>

                        <option value="Drainage">
                            Drainage
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter location"
                        required
                    >

                    <button
                        type="button"
                        class="location-btn"
                        id="detectLocationBtn"
                    >
                        📍 Detect Location
                    </button>

                    <!-- Detected location will appear here -->

                    <div id="locationResult"></div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe the issue"
                        required
                    ></textarea>

                </div>


                <!-- IMAGE UPLOAD -->

                <div class="form-group">

                    <label for="issueImage">
                        Upload Image
                    </label>

                    <input
                        type="file"
                        id="issueImage"
                        accept="image/*"
                    >

                    <small>
                        Upload an image showing the reported issue.
                    </small>

                    <!-- Image preview -->

                    <img
                        id="imagePreview"
                        alt="Selected issue image preview"
                    >

                </div>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Report
                </button>

            </form>

        </div>

    </main>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>

        <p>
            © 2026 Public Infrastructure Issues Reporting System
        </p>

    </footer>


    <script>

        /* ==========================================
           IMAGE PREVIEW
           ========================================== */

        const issueImage =
            document.getElementById("issueImage");

        const imagePreview =
            document.getElementById("imagePreview");


        issueImage.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function (event) {

                    imagePreview.src =
                        event.target.result;

                    imagePreview.style.display =
                        "block";

                };

                reader.readAsDataURL(file);

            } else {

                imagePreview.src = "";

                imagePreview.style.display =
                    "none";
            }

        });


        /* ==========================================
           DETECT LOCATION
           ========================================== */

        const detectLocationBtn =
            document.getElementById("detectLocationBtn");

        const locationInput =
            document.getElementById("location");

        const locationResult =
            document.getElementById("locationResult");


        detectLocationBtn.addEventListener(
            "click",
            function () {

                if (!navigator.geolocation) {

                    locationResult.innerText =
                        "Location detection is not supported by this browser.";

                    locationResult.style.display =
                        "block";

                    return;
                }


                locationResult.innerText =
                    "Detecting your location...";

                locationResult.style.display =
                    "block";


                navigator.geolocation.getCurrentPosition(

                    function (position) {

                        const latitude =
                            position.coords.latitude;

                        const longitude =
                            position.coords.longitude;


                        /*
                         IMPORTANT:
                         Do NOT replace the location input.

                         If user typed:
                         Chennai

                         It will remain:
                         Chennai
                        */


                        locationResult.innerText =
                            "📍 Detected Location: " +
                            latitude.toFixed(6) +
                            ", " +
                            longitude.toFixed(6);


                        locationResult.style.display =
                            "block";

                    },


                    function () {

                        locationResult.innerText =
                            "Unable to detect location. Please allow location permission or enter it manually.";

                        locationResult.style.display =
                            "block";

                    }

                );

            }
        );


        /* ==========================================
           SUBMIT REPORT
           ========================================== */

        const reportForm =
            document.getElementById("reportForm");


        reportForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const issueTitle =
                    document.getElementById(
                        "issueTitle"
                    ).value.trim();


                const category =
                    document.getElementById(
                        "category"
                    ).value;


                const location =
                    document.getElementById(
                        "location"
                    ).value.trim();


                const description =
                    document.getElementById(
                        "description"
                    ).value.trim();


                if (
                    !issueTitle ||
                    !category ||
                    !location ||
                    !description
                ) {

                    alert(
                        "Please fill all required fields."
                    );

                    return;
                }


                /* Get existing reports */

                let reports =
                    JSON.parse(
                        localStorage.getItem("reports")
                    ) || [];


                /* Create new report */

                const newReport = {

                    id: Date.now(),

                    title: issueTitle,

                    category: category,

                    location: location,

                    description: description,

                    date:
                        new Date().toLocaleDateString(),

                    status: "Submitted"

                };


                /* Add new report */

                reports.push(newReport);


                /* Save reports */

                localStorage.setItem(
                    "reports",
                    JSON.stringify(reports)
                );


                /* Save selected report */

                localStorage.setItem(
                    "selectedReportId",
                    newReport.id
                );


                alert(
                    "Report submitted successfully!"
                );


                /* Go to My Reports */

                window.location.href =
                    "my-reports.html";

            }
        );

    </script>

</body>
</html>
